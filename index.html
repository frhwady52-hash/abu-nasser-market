<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو ناصر ماركت - الدفتر الرقمي</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- الهيدر الخاص بـ أبو ناصر ماركت -->
    <header class="header">
        <div class="logo">
            <h1>🛒 أبو ناصر <span>ماركت</span></h1>
            <p>دفتر الحسابات والديون الإلكتروني</p>
        </div>
        <div class="status-bar">
            <span id="connectionStatus" class="badge online">📡 متصل بالإنترنت</span>
        </div>
    </header>

    <main class="container">
        <!-- قسم إضافة زبون جديد -->
        <section class="card">
            <h2>إضافة زبون / تاجر جديد</h2>
            <form id="addCustomerForm" class="form-group">
                <input type="text" id="customerName" placeholder="اسم الزبون" required>
                <input type="tel" id="customerPhone" placeholder="رقم الجوال">
                <button type="submit" class="btn btn-primary">+ إضافة حساب</button>
            </form>
        </section>

        <!-- قائمة الزبائن -->
        <section class="card">
            <div class="card-header">
                <h2>قائمة الحسابات والديون</h2>
                <input type="text" id="searchCustomer" placeholder="🔍 بحث عن زبون..." onkeyup="searchCustomers()">
            </div>
            <div id="customersList" class="customers-list">
                <!-- يتم تعبئة الزبائن ديناميكياً بواسطة JavaScript -->
            </div>
        </section>

        <!-- نافذة تفاصيل الحساب والمعاملات (Modal) -->
        <div id="transactionModal" class="modal">
            <div class="modal-content">
                <span class="close-btn" id="closeModal">&times;</span>
                <h2 id="modalCustomerName">كشف حساب</h2>
                <div class="summary-box">
                    <span>صافي الرصيد الحالي: </span>
                    <strong id="modalCustomerBalance">0</strong> شيكل
                </div>

                <!-- إضافة معاملة جديدة -->
                <form id="addTransactionForm" class="form-inline">
                    <select id="transType">
                        <option value="debit">🛒 طلبية / بضاعة (عليه)</option>
                        <option value="credit">💵 دفعة كاش (له)</option>
                    </select>
                    <input type="number" id="transAmount" placeholder="المبلغ" step="0.5" required>
                    <input type="text" id="transNote" placeholder="تفاصيل الطلبية / البيان">
                    <button type="submit" class="btn btn-success">تسجيل المعاملة</button>
                </form>

                <!-- سجل المعاملات -->
                <h3>سجل الحركة الحسابية</h3>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>التاريخ</th>
                                <th>نوع الحركة</th>
                                <th>المبلغ</th>
                                <th>البيان / التفاصيل</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsTableBody">
                            <!-- جدول المعاملات -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
