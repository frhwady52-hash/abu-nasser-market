<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو ناصر ماركت - يومية اليوم</title>
    <style>
        :root {
            --primary-dark: #0f172a;
            --accent-green: #16a34a;
            --accent-red: #dc2626;
            --accent-gold: #f59e0b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: #1e293b; margin: 0; padding-bottom: 80px; }

        /* الهيدر العلوي */
        .top-bar {
            background: #ffffff;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; background: #854d0e; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; }
        .user-title { font-weight: bold; font-size: 1.1rem; margin: 0; }
        .user-date { font-size: 0.75rem; color: #64748b; margin-top: 2px; }
        
        .status-badge { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .debt-box { margin-top: 8px; font-size: 1.2rem; font-weight: bold; color: var(--accent-red); }
        .debt-label { font-size: 0.75rem; color: #64748b; font-weight: normal; }

        .container { max-width: 500px; margin: 10px auto; padding: 0 12px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* عنوان الصفحة وتنقل التاريخ */
        .page-header { text-align: center; margin: 15px 0; }
        .page-title { font-size: 1.4rem; font-weight: bold; margin: 0; }
        .date-navigator { display: flex; align-items: center; justify-content: center; gap: 15px; color: #64748b; font-size: 0.85rem; margin-top: 5px; }
        .nav-arrow { background: white; border: 1px solid var(--border-color); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #334155; }

        /* شبكة اليومية */
        .grid-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .daily-card { background: var(--card-bg); border-radius: 16px; padding: 15px; text-align: center; border: 1px solid var(--border-color); }
        .daily-card.expense-card { background: #fffbeb; border-color: #fef3c7; }
        .card-title { font-size: 0.85rem; color: #64748b; margin-bottom: 8px; font-weight: bold; }
        .card-value { font-size: 1.4rem; font-weight: bold; }
        .val-red { color: var(--accent-red); }
        .val-green { color: var(--accent-green); }
        .val-dark { color: #0f172a; }

        /* صافي الصندوق */
        .net-box { display: flex; justify-content: space-between; align-items: center; margin: 25px 5px 15px 5px; }
        .net-title { font-size: 1.1rem; font-weight: bold; }
        .net-value { font-size: 1.3rem; font-weight: bold; color: #0f172a; }

        /* الأزرار الرئيسية */
        .btn-black { background: #0f172a; color: white; border: none; width: 100%; padding: 14px; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-white { background: white; color: #0f172a; border: 1px solid var(--border-color); width: 100%; padding: 14px; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; }

        /* القائمة السفلية */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; }
        .nav-btn { background: none; border: none; text-align: center; color: #64748b; font-size: 0.75rem; cursor: pointer; flex: 1; }
        .nav-btn.active { color: var(--accent-gold); font-weight: bold; }
        .nav-btn.active .nav-icon { background: #fef3c7; border-radius: 20px; padding: 2px 12px; }
        .nav-icon { display: block; font-size: 1.2rem; margin-bottom: 2px; }

        input, select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 10px; font-size: 1rem; }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <div class="top-bar">
        <div class="user-info">
            <div class="avatar">M</div>
            <div>
                <div class="user-title">...hammed</div>
                <div class="user-date" id="headerDate">19/10/2026</div>
                <div class="debt-box"><span id="headerTotalDebts">15.00</span> <span class="debt-label">إجمالي الديون شيكل</span></div>
            </div>
        </div>
        <div>
            <span class="status-badge">متصل ✓</span>
        </div>
    </div>

    <div class="container">

        <!-- قسم اليومية -->
        <div id="tab-daily" class="tab-content active">
            <div class="page-header">
                <h1 class="page-title">يومية اليوم</h1>
                <div class="date-navigator">
                    <button class="nav-arrow" onclick="changeDate(-1)">❯</button>
                    <span id="currentDailyDate">الإثنين 19/10/2026</span>
                    <button class="nav-arrow" onclick="changeDate(1)">❮</button>
                </div>
            </div>

            <div class="grid-cards">
                <div class="daily-card">
                    <div class="card-title">مبيعات على الحساب</div>
                    <div class="card-value val-red" id="accountSalesVal">0.00</div>
                </div>
                <div class="daily-card">
                    <div class="card-title">مبيعات فورية</div>
                    <div class="card-value val-gold" id="cashSalesVal" style="color:#d97706">0.00</div>
                </div>
                <div class="daily-card">
                    <div class="card-title">ديون مسدَّدة</div>
                    <div class="card-value val-green" id="paidDebtsVal">0.00</div>
                </div>
                <div class="daily-card expense-card">
                    <div class="card-title" style="color:#b45309">مصاريف ▾</div>
                    <div class="card-value val-dark" id="expensesVal">0.00</div>
                </div>
            </div>

            <div class="daily-card" style="margin-top: 12px; grid-column: span 2;">
                <div class="card-title">عدد الحركات</div>
                <div class="card-value val-dark" id="totalTxCount">0</div>
            </div>

            <div class="net-box">
                <div class="net-title">صافي الصندوق اليوم</div>
                <div class="net-value"><span id="netBoxVal">0.00</span> شيكل</div>
            </div>

            <button class="btn-black" onclick="closeBox()"><span style="font-size:1.1rem">🔒</span> إغلاق الصندوق</button>
            <button class="btn-white" onclick="openExpenseModal()">+ تسجيل مصروف</button>
        </div>

        <!-- باقي الأقسام المؤقتة -->
        <div id="tab-order" class="tab-content"><h2 style="text-align:center;">صفحة الطلبية</h2></div>
        <div id="tab-customers" class="tab-content"><h2 style="text-align:center;">صفحة الزبائن</h2></div>
        <div id="tab-reports" class="tab-content"><h2 style="text-align:center;">صفحة التقارير</h2></div>
        <div id="tab-late" class="tab-content"><h2 style="text-align:center;">صفحة المتأخرين</h2></div>

    </div>
