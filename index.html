<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو ناصر ماركت - الدفتر الرقمي</title>
    <style>
        :root {
            --primary-color: #0f766e;
            --accent-color: #f59e0b;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        .header {
            background-color: #0f172a;
            color: white;
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .header h1 { margin: 0; font-size: 1.4rem; }
        .header h1 span { color: var(--accent-color); }
        .header p { margin: 4px 0 0 0; font-size: 0.85rem; color: #94a3b8; }

        .badge {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .badge.online { background-color: var(--success-color); color: white; }
        .badge.offline { background-color: var(--danger-color); color: white; }

        .container { max-width: 800px; margin: 1.5rem auto; padding: 0 1rem; }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .card h2 { margin-top: 0; font-size: 1.2rem; color: var(--primary-color); }

        /* أزرار التبديل بين الزبائن والموردين */
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid var(--primary-color);
            background: transparent;
            color: var(--primary-color);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .form-group, .form-inline { display: flex; gap: 10px; flex-wrap: wrap; }

        input, select, button {
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        input:focus, select:focus { outline: none; border-color: var(--primary-color); }
        input, select { flex: 1; min-width: 140px; }

        .btn { cursor: pointer; border: none; color: white; font-weight: bold; border-radius: 8px; }
        .btn-primary { background-color: var(--primary-color); }
        .btn-success { background-color: var(--success-color); }

        .customer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.9rem;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .customer-item:hover { background-color: #f8fafc; }

        .balance.positive { color: var(--danger-color); font-weight: bold; }
        .balance.negative { color: var(--success-color); font-weight: bold; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            width: 92%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            left: 1rem; top: 0.8rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: #64748b;
        }

        .summary-box {
            background: #f1f5f9;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            font-size: 1.1rem;
            border-right: 4px solid var(--primary-color);
        }

        .table-wrapper { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: right; }
        th { background-color: #f8fafc; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <h1>🛒 أبو ناصر <span>ماركت</span></h1>
            <p>دفتر الحسابات، الزبائن والموردين</p>
        </div>
        <div class="status-bar">
            <span id="connectionStatus" class="badge online">📡 متصل</span>
        </div>
    </header>

    <main class="container">
        <!-- أزرار التبديل بين الزبائن والموردين -->
        <div class="tab-buttons">
            <button class="tab-btn active" id="btnCustomers" onclick="switchTab('customer')">👥 الزبائن</button>
            <button class="tab-btn" id="btnSuppliers" onclick="switchTab('supplier')">🚚 الموردين (تجار الجملة)</button>
        </div>

        <!-- إضافة حساب -->
        <section class="card">
            <h2 id="addFormTitle">إضافة زبون جديد</h2>
            <form id="addAccountForm" class="form-group">
                <input type="text" id="accountName" placeholder="الاسم" required>
                <input type="tel" id="accountPhone" placeholder="رقم الجوال">
                <button type="submit" class="btn btn-primary" id="addBtnText">+ إضافة للحسابات</button>
            </form>
        </section>

        <!-- القائمة -->
        <section class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 1rem;">
                <h2 id="listTitle" style="margin: 0;">قائمة حسابات الزبائن</h2>
                <input type="text" id="searchAccount" placeholder="🔍 بحث..." onkeyup="searchAccounts()">
            </div>
            <div id="accountsList"></div>
        </section>

        <!-- النافذة (Modal) -->
        <div id="transactionModal" class="modal">
            <div class="modal-content">
                <span class="close-btn" id="closeModal">&times;</span>
                <h2 id="modalAccountName">كشف حساب</h2>
                <div class="summary-box">
                    <span>صافي الرصيد الحالي: </span>
                    <strong id="modalAccountBalance">0</strong> شيكل
                </div>

                <form id="addTransactionForm" class="form-inline">
                    <select id="transType"></select>
                    <input type="number" id="transAmount" placeholder="المبلغ" step="0.5" required>
                    <input type="text" id="transNote" placeholder="البيان / تفاصيل الفاتورة">
                    <button type="submit" class="btn btn-success">تسجيل الحركة</button>
                </form>

                <h3 style="margin-top: 1.5rem;">سجل الحركة الحسابية</h3>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>التاريخ</th>
                                <th>نوع الحركة</th>
                                <th>المبلغ</th>
                                <th>البيان</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const STORAGE_KEY = 'abu_nasser_market_v2';
        let accounts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentType = 'customer'; // customer أو supplier
        let currentAccountId = null;

        const connectionStatus = document.getElementById('connectionStatus');
        const addAccountForm = document.getElementById('addAccountForm');
        const accountsList = document.getElementById('accountsList');
        const transactionModal = document.getElementById('transactionModal');
        const closeModal = document.getElementById('closeModal');
        const addTransactionForm = document.getElementById('addTransactionForm');
        const transTypeSelect = document.getElementById('transType');

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        function updateOnlineStatus() {
            if (navigator.onLine) {
                connectionStatus.textContent = '📡 متصل';
                connectionStatus.className = 'badge online';
            } else {
                connectionStatus.textContent = '⚡ أوفلاين';
                connectionStatus.className = 'badge offline';
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
            renderAccounts();
        }

        function switchTab(type) {
            currentType = type;
            document.getElementById('btnCustomers').classList.toggle('active', type === 'customer');
            document.getElementById('btnSuppliers').classList.toggle('active', type === 'supplier');
            
            document.getElementById('addFormTitle').textContent = type === 'customer' ? 'إضافة زبون جديد' : 'إضافة مورد / تاجر جملة جديد';
            document.getElementById('listTitle').textContent = type === 'customer' ? 'قائمة حسابات الزبائن' : 'قائمة حسابات الموردين';
            document.getElementById('accountName').placeholder = type === 'customer' ? 'اسم الزبون' : 'اسم المورد / الشركة';
            
            renderAccounts();
        }
