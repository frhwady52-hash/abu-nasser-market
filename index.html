<head>

<title>أبو ناصر ماركت — نظام إدارة المحل</title>
<style>
:root{--green:#126b55;--green2:#17856a;--pale:#e5f6f0;--bg:#f4f7fb;--ink:#172b3a;--muted:#718096;--line:#e5ebf1;--red:#c23e4d;--amber:#9a6700;--blue:#2765bd}

body{margin:0;background:linear-gradient(180deg,#eaf6f1 0,#f5f7fb 210px,#f5f7fb 100%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.55;padding-bottom:18px}

          <body>
<header>
  <div class="brand">
    <div class="logo">🛒</div>
    <div>
      <h1>أبو ناصر ماركت</h1>
      <p>نظام إدارة المحل والحسابات — العملة: الشيكل ₪</p>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="topline">
    <h2 id="pageTitle">لوحة التحكم</h2>
    <span class="date" id="today"></span>
  </div>

  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard">🏠 الرئيسية</button>
    <button data-page="customers">👥 الزبائن والديون</button>
    <button data-page="sales">🧾 المبيعات</button>
    <button data-page="purchases">📦 المشتريات</button>
    <button data-page="expenses">💸 المصاريف</button>
    <button data-page="inventory">🧺 المخزون</button>
    <button data-page="reports">📊 التقارير</button>
    <button data-page="backup">💾 النسخ الاحتياطي</button>
  </nav>

  <section id="dashboard" class="page">
    <div class="cards" id="stats"></div>
    <div class="panel">
      <div class="section-head">
        <h3>آخر الحركات</h3>
        <span class="pill">أحدث 8 عمليات</span>
      </div>
      <div id="recent"></div>
    </div>
    <div class="notice">
      هذا إصدار محلي: يحفظ البيانات في متصفح هذا الجهاز فقط.
      خذ نسخة احتياطية بانتظام. لا توجد مزامنة بين الأجهزة.
    </div>
  </section>

  <section id="customers" class="page hidden">
    <div class="panel">
      <h3>➕ إضافة زبون</h3>
      <form id="customerForm">
        <div class="fields">
          <div>
            <label>اسم الزبون *</label>
            <input id="cName" required maxlength="80" placeholder="اسم الزبون">
          </div>
          <div>
            <label>رقم الهاتف</label>
            <input id="cPhone" maxlength="30" placeholder="اختياري">
          </div>
          <div>
            <label>الدين الافتتاحي (₪)</label>
            <input id="cDebt" type="number" min="0" step=".01" value="0" required>
          </div>
          <div>
            <label>ملاحظة</label>
            <input id="cNote" maxlength="150" placeholder="اختياري">
          </div>
        </div>
        <div class="form-actions">
          <button class="primary">حفظ الزبون</button>
        </div>
      </form>
    </div>
    <div class="panel">
      <div class="section-head">
        <h3>قائمة الزبائن</h3>
        <input class="search" id="customerSearch" placeholder="🔎 ابحث بالاسم أو الهاتف">
      </div>
      <div id="customerTable"></div>
    </div>
  </section>

  <section id="sales" class="page hidden">
    <div class="panel">
      <h3>➕ تسجيل عملية بيع</h3>
      <form id="saleForm">
        <div class="fields">
          <div>
            <label>البيان *</label>
            <input id="sDesc" required maxlength="120" placeholder="مثال: مواد غذائية">
          </div>
          <div>
            <label>المبلغ (₪) *</label>
            <input id="sAmount" type="number" min=".01" step=".01" required>
          </div>
          <div>
            <label>طريقة البيع</label>
            <select id="sType">
              <option value="cash">نقدًا</option>
              <option value="credit">على الحساب (دين)</option>
            </select>
          </div>
          <div id="saleCustomerWrap">
            <label>الزبون (للبيع على الحساب)</label>
            <select id="sCustomer"></select>
          </div>
          <div>
            <label>التاريخ</label>
            <input id="sDate" type="date" required>
          </div>
          <div>
            <label>ملاحظة</label>
            <input id="sNote" maxlength="150">
          </div>
        </div>
        <div class="form-actions">
          <button class="primary">حفظ البيع</button>
        </div>
      </form>
    </div>
    <div class="panel">
      <div class="section-head">
        <h3>سجل المبيعات</h3>
        <input class="search" id="saleSearch" placeholder="ابحث بالبيان">
      </div>
      <div id="saleTable"></div>
    </div>
  </section>

  <section id="purchases" class="page hidden">
    <div class="panel">
      <h3>➕ تسجيل مشتريات من مورد</h3>
      <form id="purchaseForm">
        <div class="fields">
          <div>
            <label>اسم المورد أو البيان *</label>
            <input id="pSupplier" required maxlength="120">
          </div>
          <div>
            <label>المبلغ (₪) *</label>
            <input id="pAmount" type="number" min=".01" step=".01" required>
          </div>
          <div>
            <label>حالة الدفع</label>
            <select id="pType">
              <option value="paid">مدفوعة</option>
              <option value="due">آجلة / مستحقة</option>
            </select>
          </div>
          <div>
            <label>التاريخ</label>
            <input id="pDate" type="date" required>
          </div>
          <div class="wide">
            <label>ملاحظة</label>
            <input id="pNote" maxlength="150">
          </div>
        </div>
        <div class="form-actions">
          <button class="primary">حفظ المشتريات</button>
        </div>
      </form>
    </div>
    <div class="panel">
      <h3>سجل المشتريات</h3>
      <div id="purchaseTable"></div>
    </div>
  </section>

  <section id="expenses" class="page hidden">
    <div class="panel">
      <h3>➕ تسجيل مصروف</h3>
      <form id="expenseForm">
        <div class="fields">
          <div>
            <label>نوع المصروف *</label>
            <input id="eDesc" required maxlength="120" placeholder="كهرباء، أجرة، نقل...">
          </div>
          <div>
            <label>المبلغ (₪) *</label>
            <input id="eAmount" type="number" min=".01" step=".01" required>
          </div>
          <div>
            <label>التاريخ</label>
            <input id="eDate" type="date" required>
          </div>
          <div>
            <label>ملاحظة</label>
            <input id="eNote" maxlength="150">
          </div>
        </div>
        <div class="form-actions">
          <button class="primary">حفظ المصروف</button>
        </div>
      </form>
    </div>
    <div class="panel">
      <h3>سجل المصاريف</h3>
      <div id="expenseTable"></div>
    </div>
  </section>

  <section id="inventory" class="page hidden">
    <div class="panel">
      <h3>➕ إضافة صنف للمخزون</h3>
      <form id="productForm">
        <div class="fields">
          <div>
            <label>اسم الصنف *</label>
            <input id="iName" required maxlength="120">
          </div>
          <div>
            <label>الكمية *</label>
            <input id="iQty" type="number" min="0" step=".01" required>
          </div>
          <div>
            <label>تكلفة الوحدة (₪)</label>
            <input id="iCost" type="number" min="0" step=".01" value="0" required>
          </div>
          <div>
            <label>سعر البيع للوحدة (₪)</label>
            <input id="iPrice" type="number" min="0" step=".01" value="0" required>
          </div>
          <div>
            <label>حد التنبيه للكمية</label>
            <input id="iMin" type="number" min="0" step=".01" value="0" required>
          </div>
        </div>
        <div class="form-actions">
          <button class="primary">حفظ الصنف</button>
        </div>
      </form>
    </div>
    <div class="panel">
      <div class="section-head">
        <h3>المخزون الحالي</h3>
        <input class="search" id="inventorySearch" placeholder="ابحث عن صنف">
      </div>
      <div id="inventoryTable"></div>
    </div>
  </section>

  <section id="reports" class="page hidden">
    <div class="panel">
      <h3>📊 تقرير حسب الفترة</h3>
      <div class="row2">
        <div>
          <label>من تاريخ</label>
          <input type="date" id="rFrom">
        </div>
        <div>
          <label>إلى تاريخ</label>
          <input type="date" id="rTo">
        </div>
      </div>
      <div class="form-actions">
        <button class="primary" id="runReport" type="button">عرض التقرير</button>
        <button class="outline" id="printReport" type="button">طباعة التقرير</button>
      </div>
      <div id="reportResults"></div>
    </div>
  </section>

  <section id="backup" class="page hidden">
    <div class="panel">
      <h3>💾 النسخ الاحتياطي والاسترجاع</h3>
      <p class="mini">نزّل ملفًا يحتوي على البيانات، واحتفظ به في مكان آمن. الاسترجاع يستبدل البيانات الحالية.</p>
      <div class="form-actions">
        <button class="primary" id="exportBtn">تنزيل نسخة احتياطية</button>
        <button class="soft" id="importBtn">استرجاع نسخة</button>
        <input id="importFile" type="file" accept=".json,application/json" hidden>
      </div>
      <div class="notice">
        النسخة الاحتياطية تحتوي على معلومات الزبائن والمعاملات والمخزون.
        احفظ الملف في مكان خاص وآمن.
      </div>
    </div>
  </section>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">تسجيل دفعة</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="primary" id="modalConfirm">تأكيد</button>
      <button class="outline" id="modalCancel">إلغاء</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
 <script>
"use strict";

const $ = id => document.getElementById(id);
const KEY = "abuNasserMarketFullV1";

const emptyData = () => ({
  customers: [],
  sales: [],
  purchases: [],
  expenses: [],
  inventory: [],
  payments: []
});

function loadData() {
  try {
    const saved = localStorage.getItem(KEY);
    if (!saved) return emptyData();
    const data = JSON.parse(saved);
    return {
      ...emptyData(),
      ...data
    };
  } catch (e) {
    alert("تعذر قراءة البيانات المحفوظة. لا تحذف بيانات المتصفح.");
    return emptyData();
  }
}

let db = loadData();

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(db));
    return true;
  } catch (e) {
    alert("تعذر حفظ البيانات. قد تكون مساحة التخزين ممتلئة.");
    return false;
  }
}

function id() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2, 8);
}

function today() {
  const d = new Date();
  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, "0"),
    String(d.getDate()).padStart(2, "0")
  ].join("-");
}

function money(n) {
  return (Number(n) || 0).toLocaleString("ar-PS", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }) + " ₪";
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

function toast(message) {
  $("toast").textContent = message;
  $("toast").classList.add("show");
  setTimeout(() => $("toast").classList.remove("show"), 2600);
}

function customerName(customerId) {
  const c = db.customers.find(x => x.id === customerId);
  return c ? c.name : "زبون محذوف";
}

function customerBalance(c) {
  const sales = db.sales
    .filter(s => s.type === "credit" && s.customerId === c.id)
    .reduce((sum, s) => sum + Number(s.amount || 0), 0);

  const payments = db.payments
    .filter(p => p.customerId === c.id)
    .reduce((sum, p) => sum + Number(p.amount || 0), 0);

  return Number(c.openingDebt || 0) + sales - payments;
}

function showPage(page) {
  document.querySelectorAll(".page").forEach(el => {
    el.classList.toggle("hidden", el.id !== page);
  });

  document.querySelectorAll("#nav button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === page);
  });

  const names = {
    dashboard: "لوحة التحكم",
    customers: "الزبائن والديون",
    sales: "المبيعات",
    purchases: "المشتريات",
    expenses: "المصاريف",
    inventory: "المخزون",
    reports: "التقارير",
    backup: "النسخ الاحتياطي"
  };

  $("pageTitle").textContent = names[page] || "أبو ناصر ماركت";

  if (page === "dashboard") renderDashboard();
  if (page === "customers") renderCustomers();
  if (page === "sales") renderSales();
  if (page === "purchases") renderPurchases();
  if (page === "expenses") renderExpenses();
  if (page === "inventory") renderInventory();
  if (page === "reports") renderReport();
}

$("nav").addEventListener("click", event => {
  const button = event.target.closest("button[data-page]");
  if (button) showPage(button.dataset.page);
});

function table(headers, rows) {
  if (!rows.length) {
    return '<div class="empty">لا توجد بيانات حتى الآن</div>';
  }

  return `
    <div class="table-wrap">
      <table>
        <thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows.join("")}</tbody>
      </table>
    </div>`;
   }
                 function setDefaultDates() {
  ["sDate","pDate","eDate","rFrom","rTo"].forEach(id => {
    if ($(id)) $(id).value = today();
  });
}

$("sType").addEventListener("change", () => {
  $("saleCustomerWrap").classList.toggle(
    "hidden", $("sType").value !== "credit"
  );
});

$("saleForm").addEventListener("submit", event => {
  event.preventDefault();

  const amount = Number($("sAmount").value);
  const type = $("sType").value;
  const customerId = $("sCustomer").value;

  if (!Number.isFinite(amount) || amount <= 0) {
    return toast("أدخل مبلغًا صحيحًا");
  }

  if (type === "credit" &&
      !db.customers.some(c => c.id === customerId)) {
    return toast("اختر الزبون أولًا");
  }

  db.sales.push({
    id: id(),
    desc: $("sDesc").value.trim(),
    amount,
    type,
    customerId: type === "credit" ? customerId : "",
    date: $("sDate").value,
    note: $("sNote").value.trim()
  });

  if (!save()) return;

  event.target.reset();
  $("sDate").value = today();
  $("sType").value = "cash";
  $("saleCustomerWrap").classList.add("hidden");
  renderSales();
  renderDashboard();
  toast("تم تسجيل البيع");
});

function renderSales() {
  const q = $("saleSearch").value.trim().toLowerCase();

  const items = db.sales.filter(s =>
    s.desc.toLowerCase().includes(q) ||
    customerName(s.customerId).toLowerCase().includes(q)
  );

  $("saleTable").innerHTML = table(
    ["التاريخ","البيان","النوع","الزبون","المبلغ","الإجراء"],
    items.map(s => `
      <tr>
        <td>${esc(s.date)}</td>
        <td>${esc(s.desc)}</td>
        <td>${s.type === "cash" ? "نقدي" : "آجل"}</td>
        <td>${s.type === "credit" ? esc(customerName(s.customerId)) : "—"}</td>
        <td class="money">${money(s.amount)}</td>
        <td><button class="danger" data-delete-sale="${esc(s.id)}">حذف</button></td>
      </tr>
    `)
  );
}

$("saleSearch").addEventListener("input", renderSales);

$("saleTable").addEventListener("click", event => {
  const btn = event.target.closest("[data-delete-sale]");
  if (!btn || !confirm("هل تريد حذف عملية البيع؟")) return;

  db.sales = db.sales.filter(s => s.id !== btn.dataset.deleteSale);
  if (save()) {
    renderSales();
    renderCustomers();
    renderDashboard();
    toast("تم حذف البيع");
  }
});

$("purchaseForm").addEventListener("submit", event => {
  event.preventDefault();

  const amount = Number($("pAmount").value);
  if (!Number.isFinite(amount) || amount <= 0) {
    return toast("أدخل مبلغًا صحيحًا");
  }

  db.purchases.push({
    id: id(),
    supplier: $("pSupplier").value.trim(),
    amount,
    type: $("pType").value,
    date: $("pDate").value,
    note: $("pNote").value.trim()
  });

  if (!save()) return;

  event.target.reset();
  $("pDate").value = today();
  renderPurchases();
  renderDashboard();
  toast("تم تسجيل المشتريات");
});

function renderPurchases() {
  $("purchaseTable").innerHTML = table(
    ["التاريخ","المورد","الحالة","المبلغ","الإجراء"],
    db.purchases.map(p => `
      <tr>
        <td>${esc(p.date)}</td>
        <td>${esc(p.supplier)}</td>
        <td>${p.type === "paid" ? "مدفوعة" : "مستحقة"}</td>
        <td class="money">${money(p.amount)}</td>
        <td><button class="danger" data-delete-purchase="${esc(p.id)}">حذف</button></td>
      </tr>
    `)
  );
}

$("purchaseTable").addEventListener("click", event => {
  const btn = event.target.closest("[data-delete-purchase]");
  if (!btn || !confirm("هل تريد حذف عملية المشتريات؟")) return;

  db.purchases = db.purchases.filter(p => p.id !== btn.dataset.deletePurchase);
  if (save()) {
    renderPurchases();
    renderDashboard();
    toast("تم حذف العملية");
  }
});

$("expenseForm").addEventListener("submit", event => {
  event.preventDefault();

  const amount = Number($("eAmount").value);
  if (!Number.isFinite(amount) || amount <= 0) {
    return toast("أدخل مبلغًا صحيحًا");
  }

  db.expenses.push({
    id: id(),

function renderExpenses() {
  $("expenseTable").innerHTML = table(
    ["التاريخ","البيان","المبلغ","الإجراء"],
    db.expenses.map(e => `
      <tr>
        <td>${esc(e.date)}</td>
        <td>${esc(e.desc)}</td>
        <td class="money">${money(e.amount)}</td>
        <td><button class="danger" data-delete-expense="${esc(e.id)}">حذف</button></td>
      </tr>
    `)
  );
}

$("expenseTable").addEventListener("click", event => {
  const btn = event.target.closest("[data-delete-expense]");
  if (!btn || !confirm("هل تريد حذف المصروف؟")) return;

  db.expenses = db.expenses.filter(e => e.id !== btn.dataset.deleteExpense);
  if (save()) {
    renderExpenses();
    renderDashboard();
    toast("تم حذف المصروف");
  }
});

$("productForm").addEventListener("submit", event => {
  event.preventDefault();

  const qty = Number($("iQty").value);
  const cost = Number($("iCost").value);
  const price = Number($("iPrice").value);
  const minQty = Number($("iMin").value);

  if (!name || [qty,cost,price,minQty].some(n => !Number.isFinite(n) || n < 0)) {
    return toast("تحقق من بيانات الصنف");
  }

  db.inventory.push({
    id: id(), name, qty, cost, price, minQty
  });

  if (!save()) return;

  event.target.reset();
  $("iCost").value = "0";
  $("iPrice").value = "0";
  $("iMin").value = "0";
  renderInventory();
  renderDashboard();
  toast("تمت إضافة الصنف");
});
